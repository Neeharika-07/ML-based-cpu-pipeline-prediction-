<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PipelineAI — CPU Pipeline Simulator & AI Branch Predictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: #111827;
      --bg-card-hover: #1f2937;
      --border-color: #2e384d;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;
      --accent-amber: #f59e0b;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    code, pre {
      font-family: 'Fira Code', monospace;
    }

    /* App Header */
    .app-header {
      background-color: rgba(17, 24, 39, 0.95);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      font-size: 24px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .brand-sub {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .nav-links {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background-color: var(--bg-card-hover);
      color: var(--text-main);
    }

    .nav-btn.active {
      background-color: #1e293b;
      color: #60a5fa;
      border-color: #3b82f6;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      background-color: rgba(31, 41, 55, 0.7);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-dot.online {
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .status-dot.offline {
      background-color: var(--accent-red);
    }

    /* Main Container */
    .main-content {
      flex: 1;
      max-width: 1350px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    /* Hero Banner */
    .hero-banner {
      background: linear-gradient(135deg, #111827 0%, #1e1b4b 100%);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 28px 32px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .hero-text h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .hero-text p {
      color: var(--text-muted);
      font-size: 14px;
      max-width: 720px;
      line-height: 1.5;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Buttons */
    .btn {
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }

    .btn-secondary {
      background-color: #374151;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: #4b5563;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background-color: var(--bg-card-hover);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-block {
      width: 100%;
      justify-content: center;
    }

    /* KPI Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .metric-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    }

    .metric-header {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .metric-body {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .metric-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
    }

    .metric-unit {
      color: var(--text-muted);
      font-size: 14px;
    }

    .metric-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .metric-green { border-top: 3px solid var(--accent-green); }
    .metric-purple { border-top: 3px solid var(--accent-purple); }
    .metric-amber { border-top: 3px solid var(--accent-amber); }
    .metric-blue { border-top: 3px solid var(--primary); }

    /* Panels */
    .panel-section {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .panel-title h3 {
      font-size: 18px;
      font-weight: 600;
    }

    /* Badges */
    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .badge-info { background: #1e3a8a; color: #93c5fd; }
    .badge-success { background: #064e3b; color: #6ee7b7; }
    .badge-danger { background: #7f1d1d; color: #fca5a5; }
    .badge-primary { background: #3730a3; color: #c7d2fe; }
    .badge-secondary { background: #374151; color: #d1d5db; }

    /* 5-Stage CPU Pipeline Visualizer */
    .pipeline-stages-container {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      padding: 16px 0;
    }

    .pipeline-stage-box {
      flex: 1;
      min-width: 190px;
      background: #1a2234;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      transition: all 0.3s;
    }

    .stage-tag {
      font-size: 20px;
      font-weight: 800;
      color: #60a5fa;
      font-family: 'Fira Code', monospace;
    }

    .stage-name {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stage-content {
      background-color: #0d131f;
      border-radius: 6px;
      padding: 10px;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .instr-badge {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: #f3f4f6;
    }

    .instr-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .bubble-placeholder {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      font-style: italic;
    }

    .stage-desc {
      font-size: 11px;
      color: #9ca3af;
    }

    .stage-arrow {
      color: #4b5563;
      font-size: 18px;
      flex-shrink: 0;
    }

    .stage-flushed {
      border-color: var(--accent-red) !important;
      background: #2b1115 !important;
      animation: shake 0.4s ease-in-out;
    }

    .stage-flushed .stage-tag {
      color: var(--accent-red);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* BHR Register Display */
    .bhr-container {
      background: #111827;
      border-radius: 8px;
      padding: 16px;
    }

    .bhr-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 12px;
      color: var(--text-muted);
    }

    .bhr-hex {
      font-family: 'Fira Code', monospace;
      color: #60a5fa;
      font-weight: 600;
    }

    .bhr-bits-grid {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .bhr-bit-box {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 4px;
      text-align: center;
      transition: all 0.2s;
    }

    .bit-interactive {
      cursor: pointer;
    }

    .bit-interactive:hover {
      transform: scale(1.08);
      border-color: #60a5fa;
    }

    .bit-val {
      display: block;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
    }

    .bit-label {
      display: block;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .bit-taken {
      background: #064e3b;
      border-color: #10b981;
      color: #6ee7b7;
    }

    .bit-not-taken {
      background: #1e293b;
      color: #94a3b8;
    }

    .bhr-legend {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--text-muted);
      align-items: center;
    }

    .legend-color {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 4px;
    }

    .legend-color.taken { background: var(--accent-green); }
    .legend-color.not-taken { background: #475569; }
    .legend-hint { margin-left: auto; font-style: italic; }

    /* Tables */
    .table-scroll {
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .data-table th {
      background: #1f2937;
      color: var(--text-muted);
      font-weight: 600;
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .data-table td {
      padding: 12px 16px;
      border-bottom: 1px solid #1f2937;
      color: var(--text-main);
    }

    .data-table tr:hover {
      background: rgba(31, 41, 55, 0.5);
    }

    .badge-pc {
      font-family: 'Fira Code', monospace;
      background: #1e293b;
      padding: 2px 8px;
      border-radius: 4px;
      color: #93c5fd;
    }

    .outcome-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .badge-taken { background: #064e3b; color: #6ee7b7; }
    .badge-not-taken { background: #374151; color: #d1d5db; }

    /* Controls Bar */
    .simulator-controls-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 18px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 24px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 170px;
    }

    .control-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-select, .form-control {
      background: #1f2937;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
    }

    .form-select:focus, .form-control:focus {
      border-color: var(--primary);
    }

    .control-actions {
      display: flex;
      gap: 8px;
    }

    .playback-toolbar {
      background: #162032;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .playback-buttons {
      display: flex;
      gap: 8px;
    }

    .cycle-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 480px;
      font-size: 13px;
    }

    .cycle-slider {
      flex: 1;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* Charts & Features */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .chart-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
    }

    .chart-card h4 {
      font-size: 14px;
      margin-bottom: 16px;
      color: var(--text-muted);
    }

    .bar-chart {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .bar-label {
      width: 90px;
      font-weight: 500;
    }

    .bar-track {
      flex: 1;
      height: 18px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .accuracy-fill {
      background: linear-gradient(90deg, #3b82f6, #10b981);
    }

    .mpki-fill {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
    }

    .bar-val {
      width: 50px;
      text-align: right;
      font-family: 'Fira Code', monospace;
      font-weight: 600;
    }

    /* Feature Importance */
    .features-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .feature-bar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .feat-rank {
      width: 30px;
      color: var(--text-muted);
      font-family: 'Fira Code', monospace;
    }

    .feat-name {
      width: 170px;
    }

    .feat-track {
      flex: 1;
      height: 10px;
      background: #1e293b;
      border-radius: 3px;
      overflow: hidden;
    }

    .feat-fill {
      height: 100%;
      background: #8b5cf6;
      border-radius: 3px;
    }

    .feat-score {
      width: 60px;
      text-align: right;
      font-family: 'Fira Code', monospace;
      color: #c4b5fd;
    }

    /* Live Predictor Page */
    .predictor-workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
    }

    .card-header {
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .card-header h4 {
      font-size: 16px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-group .form-control {
      flex: 1;
    }

    .result-banner {
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
    }

    .result-taken {
      background: linear-gradient(135deg, #064e3b, #047857);
      border: 1px solid #10b981;
    }

    .result-not-taken {
      background: linear-gradient(135deg, #1e293b, #334155);
      border: 1px solid #64748b;
    }

    .result-tag {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .result-label {
      font-size: 13px;
      color: #d1d5db;
      margin-top: 4px;
    }

    .result-confidence {
      font-size: 14px;
      margin-top: 12px;
      font-family: 'Fira Code', monospace;
    }

    .result-details {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #0d131f;
      padding: 16px;
      border-radius: 6px;
      font-size: 13px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    /* Trace Grid in Dashboard */
    .traces-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .trace-card {
      background: #172033;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .trace-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .trace-badge {
      font-family: 'Fira Code', monospace;
      font-weight: 700;
      color: #60a5fa;
    }

    .trace-ratio {
      font-size: 12px;
      color: var(--accent-green);
    }

    .trace-card-body {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Footer */
    .app-footer {
      border-top: 1px solid var(--border-color);
      padding: 20px 32px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      background: #090d16;
      margin-top: auto;
    }

    .footer-meta {
      margin-top: 6px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div id="app-root"></div>
  <script type="module" src="src/app.js?v=2.1"></script>
</body>
</html>
