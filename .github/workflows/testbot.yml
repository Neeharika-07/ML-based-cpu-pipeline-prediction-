
name: TestBot - Testing Engineer

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What should TestBot test?"
        required: true
        type: string
      issue_number:
        description: "GitHub issue number for the report (optional)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  testing-engineer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn pytest

      - name: Run existing tests
        id: tests
        continue-on-error: true
        run: |
          if find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            python -m pytest -v --tb=short
          else
            echo "No existing pytest test files found."
          fi

      - name: Ask TestBot AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TASK: ${{ inputs.task }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, subprocess

          files = []
          for root, dirs, names in os.walk("."):
              dirs[:] = [d for d in dirs if d not in [
                  ".git", ".github", "__pycache__", ".venv"
              ]]
              for name in names:
                  if name.endswith((".py", ".md", ".txt")):
                      path = os.path.join(root, name)
                      if os.path.getsize(path) < 100000:
                          try:
                              with open(path, encoding="utf-8") as f:
                                  files.append(
                                      f"\n--- {path} ---\n{f.read()[:4000]}"
                                  )
                          except Exception:
                              pass

          prompt = f"""
          You are TestBot, the Testing Engineer for an
          ML-Based CPU Pipeline Prediction project.

          Your responsibilities:
          - Test CPU simulator functionality.
          - Review Static, Dynamic, Bimodal, GShare and Perceptron predictors.
          - Review ML model evaluation and prediction logic.
          - Identify bugs and edge cases.
          - Suggest meaningful test cases.
          - Report testing limitations honestly.

          User task: {os.environ['TASK']}

          Existing pytest result: {os.environ['TEST_RESULT']}

          Repository source:
          {''.join(files[:60])}

          Produce a structured testing report with:
          1. Tests performed or inspected.
          2. Passed checks.
          3. Failed checks.
          4. Potential bugs.
          5. Missing test coverage.
          6. Recommended next steps.

          IMPORTANT:
          Do not claim that you executed tests you did not execute.
          Do not modify project files.
          Do not invent test results.
          """

          payload = {
              "model": "gpt-4.1-mini",
              "input": prompt
          }

          req = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["OPENAI_API_KEY"],
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(req) as response:
              result = json.loads(response.read())

          report = "\n".join(
              item["text"]
              for output in result["output"]
              for item in output.get("content", [])
              if item.get("type") == "output_text"
          )

          print(report)

          issue = os.environ.get("ISSUE_NUMBER")
          if issue:
              subprocess.run([
                  "gh", "issue", "comment", issue,
                  "--repo", os.environ["REPO"],
                  "--body", "## 🤖 TestBot Testing Report\n\n" + report
              ], check=True)
          PY
